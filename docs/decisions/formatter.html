<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A formatter: Prettier, .editorconfig, or neither — eagle-eye</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Drafting: one ink on one paper; amber = caution only, green = normal only; neutrals are ink at alpha; no radius, no shadow. */
:root{
  --dw-paper:#fafaf7; --dw-ink:#22262b; --dw-caution:#d97706; --dw-normal:#15803d;
  --dw-ink-80:rgb(34 38 43 / .8); --dw-ink-55:rgb(34 38 43 / .55); --dw-ink-30:rgb(34 38 43 / .3); --dw-ink-12:rgb(34 38 43 / .12); --dw-grid:rgb(34 38 43 / .05);
  --dw-font:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  /* Spacing scale. Raise these to loosen the whole page; nothing hardcodes a gap that is on this scale. */
  --sp-1:8px; --sp-2:14px; --sp-3:20px; --sp-4:28px; --sp-5:36px; --sp-6:48px;
  --sp-gutter:36px;              /* the left/right margin every band shares */
  --card-min:350px;              /* option card track width in the row detail */
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
/* `hidden` is a property the shell sets on .exportbox and .preset-note. Both carry display:flex,
   which outranks the UA rule for [hidden] — so without this line neither panel ever hides. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--dw-font);font-size:15px;line-height:1.6;color:var(--dw-ink);background-color:var(--dw-paper);
  background-image:linear-gradient(to right,var(--dw-grid) 1px,transparent 1px),linear-gradient(to bottom,var(--dw-grid) 1px,transparent 1px);background-size:24px 24px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit;background:var(--dw-paper);border:1px solid var(--dw-ink-30)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:500;color:var(--dw-ink-55)}
.num{font-variant-numeric:tabular-nums}
.chip{font-size:11px;text-transform:uppercase;letter-spacing:.16em;padding:6px 14px;border:1px solid var(--dw-ink);color:var(--dw-ink);background:transparent;white-space:nowrap;
  transition:color .16s var(--ease),border-color .16s var(--ease),background-color .16s var(--ease)}
.chip:hover{color:var(--dw-caution);border-color:var(--dw-caution)}
.chip.on{background:var(--dw-ink);color:var(--dw-paper);border-color:var(--dw-ink)}
.chip.on:hover{color:var(--dw-paper);border-color:var(--dw-ink)}
.chip.ghost{border-color:var(--dw-ink-30);color:var(--dw-ink-55)}
/* Reset holding an undo offer. Amber, because taking a reset back is a recovery, not a normal move. */
/* Filled, not outlined: every chip goes amber on hover, so an outline would say nothing here. */
#reset.armed{background:var(--dw-caution);border-color:var(--dw-caution);color:var(--dw-paper)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.16em;padding:4px 13px;border:1px solid currentColor;white-space:nowrap}
.state::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.state.caution{color:var(--dw-caution)} .state.normal{color:var(--dw-normal)} .state.ink{color:var(--dw-ink-55)}
.tier{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--dw-ink-55);white-space:nowrap}
.tier.measured{color:var(--dw-normal)} .tier.sourced{color:var(--dw-ink)} .tier.argued{color:var(--dw-caution)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none}
.dot.caution{background:var(--dw-caution)} .dot.normal{background:var(--dw-normal)} .dot.ink{background:var(--dw-ink)}
.page{min-height:100%;padding:var(--sp-4);display:flex;flex-direction:column}
.sheet{flex:1;border:2px solid var(--dw-ink);background:rgb(250 250 247 / .72);display:flex;flex-direction:column;min-height:calc(100vh - var(--sp-4) * 2)}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-4);padding:var(--sp-4) var(--sp-gutter) var(--sp-3);border-bottom:1px solid var(--dw-ink-30);flex-wrap:wrap}
.head h1{font-size:24px;font-weight:600;line-height:1.25;margin:10px 0 0}
.controls{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.controls .group{display:flex;gap:var(--sp-1);align-items:center;flex-wrap:wrap}
.preset-note{display:flex;gap:var(--sp-4);align-items:flex-start;padding:var(--sp-2) var(--sp-gutter);border-bottom:1px solid var(--dw-ink-12);font-size:13px;line-height:1.55;color:var(--dw-ink-80)}
.preset-note p{margin:0;flex:1;max-width:78ch}
.steps{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.steps button{font-size:11px;text-transform:uppercase;letter-spacing:.16em;padding:5px 12px;border:1px solid var(--dw-ink-30);color:var(--dw-ink-80);
  transition:color .16s var(--ease),border-color .16s var(--ease),opacity .2s var(--ease)}
.steps button:hover{color:var(--dw-caution);border-color:var(--dw-caution)}
.steps button.next{border-color:var(--dw-ink);color:var(--dw-ink)}
.steps button.done{opacity:.4}
/* Export: the one line worth reading stays open; the long Markdown folds away. */
.exportbox{padding:var(--sp-2) var(--sp-gutter) var(--sp-3);border-bottom:1px solid var(--dw-ink-12);display:flex;flex-direction:column;gap:var(--sp-2)}
.exportbox textarea{width:100%;font-size:12.5px;line-height:1.5;padding:var(--sp-2);resize:vertical;margin-top:var(--sp-1)}
.exportbox .row{display:flex;gap:var(--sp-1);align-items:center;flex-wrap:wrap}
.exportbox input{flex:1;min-width:240px;font-size:12.5px;padding:7px 10px}
.exportbox details{border-top:1px solid var(--dw-ink-12);padding-top:var(--sp-2);margin-top:0}
.exportbox .spacer{margin-left:auto;display:flex;gap:var(--sp-1)}
.restore{flex:1;min-width:0;font-size:12.5px;padding:7px 10px;border:1px dashed var(--dw-ink-30);color:var(--dw-ink-80);overflow-x:auto;white-space:nowrap;user-select:all}
/* findings view */
.findings{flex:1;display:grid;grid-template-columns:400px minmax(0,1fr);min-height:0}
.index{border-right:1px solid var(--dw-ink-30);display:flex;flex-direction:column}
.index .row{display:grid;grid-template-columns:28px 1fr auto;gap:var(--sp-2);align-items:center;padding:var(--sp-2) var(--sp-4);border-bottom:1px solid var(--dw-ink-12);font-size:13px;line-height:1.5;width:100%;
  transition:background-color .16s var(--ease),box-shadow .2s var(--ease),color .16s var(--ease)}
.index .row:hover{background:rgb(34 38 43 / .04)}
.index .row.open{box-shadow:inset 3px 0 0 var(--dw-ink)}
.index .row.over{background:var(--dw-ink);color:var(--dw-paper)}
.index .row.over .label,.index .row.over .muted{color:rgb(250 250 247 / .55)}
.index .row.predict{cursor:pointer}
.index .row.predicted{box-shadow:inset 3px 0 0 var(--dw-caution)}
.index .row.hit{box-shadow:inset 3px 0 0 var(--dw-normal)}
.index .row.miss{box-shadow:inset 3px 0 0 var(--dw-caution);background:rgb(217 119 6 / .08)}
.index .row.fp{box-shadow:inset 3px 0 0 var(--dw-ink-30)}
.muted{color:var(--dw-ink-55)}
.index .legend{margin-top:auto;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--dw-ink-30);display:flex;gap:var(--sp-3);flex-wrap:wrap;line-height:1.9}
.right{display:flex;flex-direction:column;min-width:0}
.verdict-bar{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);padding:var(--sp-3) var(--sp-6);border-bottom:1px solid var(--dw-ink-12)}
.stamp{border:2.5px solid currentColor;padding:4px 14px;font-size:18px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;transform:rotate(-2.5deg);white-space:nowrap}
.stamp.caution{color:var(--dw-caution)} .stamp.normal{color:var(--dw-normal)} .stamp.ink{color:var(--dw-ink-30)}
.body{flex:1;padding:var(--sp-5) var(--sp-6) var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}
.find{display:grid;grid-template-columns:11px 48px 84px minmax(0,1fr);gap:var(--sp-2);align-items:baseline}
.find .pt{width:11px;height:11px;border-radius:50%;background:var(--dw-ink);align-self:center}
.find .lead{border-top:1.5px dashed var(--dw-ink-30);align-self:center}
.find .tag{color:var(--dw-caution);font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:500}
.find .tag.ink{color:var(--dw-ink-55)}
.find .txt{font-size:15px;line-height:1.6}
.h2{font-size:30px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;line-height:1.15;margin:0}
.annot{font-size:13px;line-height:1.6;color:var(--dw-ink-80);max-width:68ch}
details{border-top:1px solid var(--dw-ink-12);padding-top:var(--sp-2);margin-top:var(--sp-1)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:var(--sp-2);padding:2px 0;transition:color .16s var(--ease)}
summary:hover{color:var(--dw-caution)}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--dw-ink-55);transition:transform .2s var(--ease)}
details[open] summary::after{content:'–'}
details ul{margin:var(--sp-2) 0 var(--sp-1);padding-left:20px;font-size:13px;line-height:1.6;color:var(--dw-ink-80)}
details li{margin-bottom:var(--sp-1)}
details[open] > :not(summary){animation:ee-unfold .22s var(--ease) both}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr));gap:var(--sp-4)}
.card{position:relative;border:1px solid var(--dw-ink-30);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);font-size:13px;line-height:1.6;
  transition:border-color .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease),opacity .25s var(--ease)}
.card.chosen{border:2px solid var(--dw-ink)}
.card.over{background:var(--dw-ink);color:var(--dw-paper);border-color:var(--dw-ink)}
.card.over .muted,.card.over .label,.card.over .tier{color:rgb(250 250 247 / .6)}
/* The tab straddles the card's top border and keeps a paper background, so it never sits on the
   dark fill. Paper-on-paper is the rule above's blind spot: it must stay ink, not go pale. */
.card.over .tab{color:var(--dw-ink)}
.card.straw{border-style:dashed;border-width:1.5px}
.card.closed{opacity:.5}
.card .tab{position:absolute;top:0;left:16px;transform:translateY(-50%);background:var(--dw-paper);padding:0 8px}
.card .ttl{font-size:15.5px;font-weight:600;line-height:1.45;margin-top:6px}
.card .cons{border-top:1px solid var(--dw-ink-12);padding-top:var(--sp-2);margin-top:var(--sp-1);display:flex;flex-direction:column;gap:var(--sp-1)}
.card.over .cons{border-top-color:rgb(250 250 247 / .2)}
.card .cons div{display:flex;gap:var(--sp-1);align-items:baseline}
.card .act{margin-top:auto;display:flex;gap:var(--sp-2);align-items:center;justify-content:space-between;padding-top:var(--sp-2);flex-wrap:wrap}
.card .act .chip{padding:5px 12px}
.card.over .act .chip{border-color:var(--dw-paper);color:var(--dw-paper)}
.card.over .act .chip.on{background:var(--dw-paper);color:var(--dw-ink)}
/* The row in plain sentences, above the cards. Two halves: the authored `problem` says what the
   row is about to somebody who does not know the domain, and the derived lines say where it stands.
   Only an author can write the first — a row named "Reachable by whom" explains itself to nobody. */
.summary{border-left:2px solid var(--dw-ink);padding:var(--sp-1) 0 var(--sp-1) var(--sp-3);margin-top:var(--sp-2);display:flex;flex-direction:column;gap:6px;max-width:84ch}
.summary p{margin:0;font-size:14px;line-height:1.65;color:var(--dw-ink-80)}
.summary p b{color:var(--dw-ink);font-weight:600}
.summary .problem{font-size:14.5px;line-height:1.75;color:var(--dw-ink)}
/* Not `.state` — that name is the status pill above, and it carries nowrap, a border and a ::before
   dot. A wrapper called .state inherited all three and overflowed the row. */
.summary .derived{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--dw-ink-12);padding-top:var(--sp-2);margin-top:2px}
.summary .hot{color:var(--dw-caution)}
.summary .hot b{color:var(--dw-caution)}
.coach{border:1.5px dashed var(--dw-caution);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2);font-size:13px;line-height:1.6}
.coach p{margin:0}
/* sheet view */
.sheetview{flex:1;display:flex;flex-direction:column;min-height:0}
.grid{flex:1;display:grid;grid-template-columns:72px 220px repeat(var(--cols,4),minmax(0,1fr));grid-auto-rows:minmax(60px,auto);font-size:13px;line-height:1.55;overflow:auto}
.grid .hd{padding:var(--sp-2) var(--sp-2);border-bottom:1px solid var(--dw-ink-30)}
.grid .ref{padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);border-bottom:1px solid var(--dw-ink-12)}
.grid .dim{padding:var(--sp-2);font-weight:500;border-bottom:1px solid var(--dw-ink-12);width:100%;transition:color .16s var(--ease)}
.grid .dim:hover{color:var(--dw-caution)}
.grid .cell{position:relative;padding:var(--sp-2);border-bottom:1px solid var(--dw-ink-12);border-right:1px solid var(--dw-ink-12);width:100%;height:100%;color:var(--dw-ink-55);
  transition:background-color .16s var(--ease),color .16s var(--ease),box-shadow .2s var(--ease)}
.grid .cell:hover{background:rgb(34 38 43 / .04);color:var(--dw-ink)}
.grid .cell.empty{cursor:default;border-right:0}
.grid .cell.chosen{box-shadow:inset 0 0 0 2px var(--dw-ink);color:var(--dw-ink);font-weight:600}
.grid .cell.over{background:var(--dw-ink);color:var(--dw-paper);font-weight:600}
.grid .cell.straw{border-left:1.5px dashed var(--dw-ink-30);border-right:1.5px dashed var(--dw-ink-30)}
.grid .cell.conf{color:var(--dw-caution)}
.grid .cell.out{color:var(--dw-ink-30);text-decoration:line-through}
.grid .cell.req{color:var(--dw-normal)}
.grid .cell.over.conf{background:var(--dw-ink);color:var(--dw-caution)}
.tip{position:fixed;z-index:10;max-width:400px;background:var(--dw-paper);border:1px solid var(--dw-ink);padding:var(--sp-2) var(--sp-3);font-size:13px;line-height:1.55;color:var(--dw-ink-80);pointer-events:none;
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .13s var(--ease),transform .13s var(--ease),visibility .13s}
.tip.show{opacity:1;visibility:visible;transform:none}
.tip .ttl{color:var(--dw-ink);font-weight:600;margin-bottom:6px}
.tip .foot{margin-top:var(--sp-2);display:flex;gap:var(--sp-2);flex-wrap:wrap}
.titleblock{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr .8fr;border-top:2px solid var(--dw-ink)}
.titleblock > div{padding:var(--sp-3) var(--sp-4);border-right:1px solid var(--dw-ink-12);display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.titleblock > div:last-child{border-right:0}

/* ---- motion. One rule: a band animates when the reader moved to it, never on every click. ---- */
@keyframes ee-rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes ee-unfold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes ee-stamp{0%{opacity:0;transform:rotate(-2.5deg) scale(.9)}60%{transform:rotate(-2.5deg) scale(1.04)}100%{opacity:1;transform:rotate(-2.5deg) scale(1)}}
/* .anim — the whole band arrived: a different view. .anim-body — only the right pane changed:
   a row opened, a coach phase advanced. The index and the verdict bar hold still for that one,
   because restacking a list the reader is pointing at reads as a flash. */
#view.anim .verdict-bar,#view.anim .index .row,#view.anim .grid{animation:ee-rise .3s var(--ease) both}
#view.anim .index .row:nth-child(n+2){animation-delay:.015s}
#view.anim .index .row:nth-child(n+5){animation-delay:.03s}
#view:is(.anim,.anim-body) .body > *{animation:ee-rise .3s var(--ease) both}
#view:is(.anim,.anim-body) .body > :nth-child(2){animation-delay:.04s}
#view:is(.anim,.anim-body) .body > :nth-child(3){animation-delay:.07s}
#view:is(.anim,.anim-body) .body > :nth-child(n+4){animation-delay:.1s}
#view:is(.anim,.anim-body) .card{animation:ee-rise .34s var(--ease) both}
#view:is(.anim,.anim-body) .card:nth-child(2){animation-delay:.05s}
#view:is(.anim,.anim-body) .card:nth-child(3){animation-delay:.09s}
#view:is(.anim,.anim-body) .card:nth-child(n+4){animation-delay:.13s}
.stamp.vchg{animation:ee-stamp .34s var(--ease) both}
@media (max-width:1000px){.findings{grid-template-columns:1fr}.index{border-right:0;border-bottom:1px solid var(--dw-ink-30)}
  :root{--sp-gutter:24px;--sp-6:32px;--card-min:280px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page"><div class="sheet">
  <div class="head">
    <div>
      <div class="label" id="eyebrow"></div>
      <h1 id="title"></h1>
    </div>
    <div class="controls">
      <div class="group"><span class="label">View</span><button class="chip" id="viewFind">Findings</button><button class="chip" id="viewSheet">Sheet</button></div>
      <div class="group" id="presetGroup"><span class="label">Presets</span><span id="presets" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
      <div class="group"><button class="chip ghost" id="coachToggle">Coach: off</button><button class="chip ghost" id="exportBtn">Export</button><button class="chip ghost" id="reset">Reset</button></div>
    </div>
  </div>
  <div class="preset-note" id="presetNote" hidden><p id="presetText"></p><div class="steps" id="presetSteps"></div></div>
  <div class="exportbox" id="exportBox" hidden>
    <div class="row"><span class="label">Paste this to Claude</span><span class="label" id="exportStatus"></span><span class="spacer"><button class="chip" id="copyBtn">Copy</button><button class="chip ghost" id="closeExport">Close</button></span></div>
    <div class="row"><code class="restore" id="restoreCode" title="Your configuration, as one line"></code></div>
    <details id="exportDetails">
      <summary class="label">Full Markdown, and load a restore code</summary>
      <div class="row" style="margin-top:var(--sp-2)"><label class="label" for="loadCode">Load</label><input id="loadCode" type="text" spellcheck="false" placeholder="eagle-eye: option-id, option-id"><button class="chip" id="loadBtn">Load</button></div>
      <textarea id="exportText" rows="14" spellcheck="false" aria-label="Your configuration as Markdown"></textarea>
    </details>
  </div>
  <div id="view"></div>
</div></div>
<div class="tip" id="tip"></div>

<script>
const BOX = {"title":"A formatter: Prettier, .editorconfig, or neither","eyebrow":"Stacks · wayfinder #236 on map #228 · 2026-08-23","dims":[{"id":"instrument","name":"The instrument","question":"Which tool formats this repository, if any tool does?","problem":"A formatter rewrites source files to one shape, so no person argues about layout. Prettier rewrites the file. An `.editorconfig` file states four settings and asks the editor to obey them; it rewrites nothing on its own. This repository has neither today, and every file is hand-formatted. The choice decides whether a machine now owns the shape of 45,080 lines of TypeScript.","opts":[{"id":"inst-prettier","label":"Prettier, pinned to an exact version","short":"Prettier","chosen":true,"src":"#236 body"},{"id":"inst-editorconfig","label":"An .editorconfig file only, with no formatter","short":".editorconfig only","src":"#236 body, point 2"},{"id":"inst-both","label":"Both: .editorconfig for editors, Prettier for the check","short":"Both files","src":"#236 body, point 2"},{"id":"inst-none","label":"Neither. Record the refusal in docs/gates.md","short":"Neither","strawman":true},{"id":"inst-later","label":"Decide after the ESLint ticket lands","short":"Decide later","strawman":true}]},{"id":"markdown","name":"Markdown","question":"Does the formatter reach the Markdown files?","problem":"This repository holds 147 Markdown files, and several gates read them as text. G41 reads the gate table in `docs/gates.md`. G31 reads the precedence table in `docs/spec/metadata-merge.md`. Both use a regular expression that demands exactly one space beside a table cell. Prettier repads every table cell to align the columns, so both patterns stop matching. This row decides which Markdown the formatter may rewrite.","opts":[{"id":"md-all","label":"Format every Markdown file","short":"All Markdown","src":"#231 probe"},{"id":"md-nodocs","label":"Format Markdown outside docs/","short":"Skip docs/","src":"this ticket, probe C3"},{"id":"md-none","label":"Exclude every Markdown file","short":"No Markdown","chosen":true,"src":"this ticket, probe C2"},{"id":"md-later","label":"Add Markdown in a second commit, after the gates change","short":"Markdown later","strawman":true}]},{"id":"config","name":"Configuration","question":"How much of Prettier's default shape does this repository override?","problem":"Prettier ships defaults and reads a `.prettierrc` file for overrides. Two defaults fight this tree. Prettier prefers double quotes, and 93 percent of the strings here are single-quoted. Prettier breaks lines at 80 characters, and 4,411 TypeScript lines are longer. Each override shrinks the reformat commit and shrinks the number of gates that go red. Each override also adds a rule a newcomer must read.","opts":[{"id":"cfg-default","label":"Prettier defaults, with no configuration file","short":"Defaults","src":"#231 probe"},{"id":"cfg-two","label":"Two overrides: singleQuote true, printWidth 100","short":"Two overrides","chosen":true,"src":"this ticket, probe C1"},{"id":"cfg-many","label":"Tune every option until the tree barely moves","short":"Tune everything","strawman":true}]},{"id":"gaterepair","name":"The brittle gate regexes","question":"What happens to the four gates a reformat breaks?","problem":"Four gates read source as text with patterns that hardcode a quote or a single space. G14 and G45 hardcode a single quote. G41 and G31 demand one space beside a table cell. A configuration can dodge all four, or the four patterns can be repaired. Dodging keeps the trap: a contributor who writes a double-quoted string today already reddens G14, and the message reads *extraction found 0 CLI subcommands*. Repair removes the trap.","opts":[{"id":"gr-first","label":"Repair all four patterns before the formatter lands","short":"Repair all four","src":"#229 resolution"},{"id":"gr-avoid","label":"Pick a configuration that breaks none, and repair nothing","short":"Dodge all four","src":"this ticket, probe C2"},{"id":"gr-avoid-plus","label":"Dodge all four, and repair the two quote patterns anyway","short":"Dodge, then repair two","chosen":true,"src":"this ticket"},{"id":"gr-after","label":"Adopt first, let the four go red, repair in a later commit","short":"Repair afterwards","strawman":true}]},{"id":"fixtures","name":"The fixture vault","question":"Does the formatter reach fixtures/?","problem":"`fixtures/vault/` holds 13 Markdown notes that stand in for the owner's real Obsidian vault. The adapter contract promises that an update leaves key order, quoting and the note body byte for byte intact. A formatter rewrites exactly that. The real vault sits outside the repository, so no formatter ever reaches it. If the formatter reaches the fixtures, the fixtures stop resembling the thing they are fixtures of.","opts":[{"id":"fx-exclude","label":"Exclude fixtures/ entirely","short":"Exclude fixtures","chosen":true,"src":"#236 body, point 3"},{"id":"fx-format","label":"Format fixtures/ like any other source","short":"Format fixtures","src":"this ticket, probe C3"},{"id":"fx-md-only","label":"Exclude the vault notes, format the cached JSON","short":"Notes out, JSON in","src":"this ticket"},{"id":"fx-generate","label":"Generate the vault notes from a script, so no committed text needs a rule","short":"Generate the notes","strawman":true}]},{"id":"astro","name":"The .astro files","question":"What happens to the four Astro components the formatter cannot read?","problem":"The site holds four `.astro` files and 979 lines. They carry the markup and every stylesheet rule, because this repository has no `.css` file. Prettier has no parser for the `.astro` extension, so it skips those files without a word. A plugin exists and is a new dependency. This row decides whether the formatter covers the site's presentation code, leaves a documented hole, or is refused over the hole.","opts":[{"id":"astro-plugin","label":"Add prettier-plugin-astro and record the dependency","short":"Add the plugin","src":"this ticket"},{"id":"astro-leave","label":"Leave the four files unformatted, and document the hole","short":"Document the hole","chosen":true,"src":"#231 finding"},{"id":"astro-refuse","label":"Refuse the formatter, because it covers only part of the tree","short":"Refuse over coverage","strawman":true}]},{"id":"blame","name":"Blame and the reformat commit","question":"How does the one large reformat commit reach main?","problem":"Adoption rewrites many files at once. `git blame` then names that commit as the last author of every rewritten line, and the real author disappears from the default view. Git reads a file named `.git-blame-ignore-revs`, which lists revisions blame skips. This repository has no such file. This row decides how the reformat arrives, and whether the history stays readable afterwards.","opts":[{"id":"blame-ignore","label":"One commit, plus a .git-blame-ignore-revs file naming it","short":"One commit, ignored","chosen":true,"src":"#236 body, point 1"},{"id":"blame-raw","label":"One commit, and no mitigation at all","short":"One commit, raw","strawman":true},{"id":"blame-split","label":"One commit per package, spread over several pull requests","short":"Split per package","src":"this ticket"}]},{"id":"surface","name":"Where the check runs","question":"Which surface refuses a badly formatted file?","problem":"A check is worth what its surface enforces. The `gates` aggregator runs on every pull request and blocks the merge, so it admits any stranger. A pre-commit hook runs only for a person who installs it, and this repository already carries one that never blocks. A refusal recorded in `docs/gates.md` enforces nothing and says so. This row decides who meets a red build, and whether anybody does.","opts":[{"id":"surf-gate","label":"The gates aggregator runs prettier --check, and pnpm format fixes","short":"gates aggregator","chosen":true,"src":"#229 resolution, §4"},{"id":"surf-hook","label":"An opt-in pre-commit hook only, with nothing in CI","short":"Hook only","src":".githooks/pre-commit"},{"id":"surf-refuse","label":"Nothing runs it. Record the refusal in docs/gates.md","short":"Record a refusal","strawman":true}]}],"rel":{"inst-prettier":{"why":"Prettier rewrites the file, so the shape is settled rather than requested. Its red has the most reachable remedy any check here could carry: run one command.","rel":[["surf-gate","req","The routing rule sends a style check that passes both tests to the gates aggregator.","sourced","#229 resolution, §4"]],"notes":["Version 3.9.6 was the probed version. Pin it exact, for ADR-0067's reason: the tool version is an input to what the check means.","Measured: Prettier reads `.editorconfig` when no `.prettierrc` key covers the same option. So the two files merge per option rather than one winning outright."]},"inst-editorconfig":{"why":"An `.editorconfig` file states indent style, character set, final newline and trailing whitespace. It is far cheaper than a formatter and it reflows nothing.","rel":[["surf-gate","conf","The tree already satisfies all four settings, so the check is green on day one and can never report a defect.","measured","this ticket: 0 files with a leading tab, 0 with trailing whitespace, 0 without a final newline, across every .ts and .md file"],["blame-ignore","conf","An .editorconfig file rewrites no file, so no reformat commit exists for blame to skip.","measured","this ticket: the file states settings and runs nothing"],["cfg-two","conf","singleQuote and printWidth are Prettier options, and no formatter reads them here.","argued"]],"notes":["⚠️ The ticket asks whether this is simply the right answer. The measurement is the honest test, and it cuts against the option: this tree has never violated any of the four settings, so the file documents a habit rather than correcting a fault.","It still buys something real for a newcomer's editor. That value is prophylactic and arrives with no gate."]},"inst-both":{"why":"The `.editorconfig` file steers every editor. Prettier steers the check. Each covers what the other cannot.","rel":[["cfg-two","req","A .prettierrc key overrides the matching .editorconfig key, so the overrides must exist to stop the second file steering the formatter.","measured","this ticket: max_line_length 60 set printWidth alone; adding printWidth 100 to .prettierrc won, while indent_size 4 still applied"]],"notes":["⚠️ Two files now set indentation and line width. The measurement shows they merge key by key, so an `.editorconfig` key nobody shadows silently steers Prettier.","That is the cost, and it is not fatal. It is a second place to look when the formatter surprises somebody."]},"inst-none":{"why":"No formatter exists today and the tree is consistent without one. The map names refusal as a first-class result.","rel":[["surf-gate","conf","With no tool, the aggregator has no command to run.","argued"],["blame-ignore","conf","With no reformat, no revision exists for blame to skip.","argued"]],"notes":["⚠️ #229 ruled out *adopt nothing* for the map, not for this candidate. Every other ticket on the map may still adopt while this one refuses.","The strongest case for it: the tree is already consistent by hand, and the formatter's whole yield is a 100-file commit plus a required check that mostly reports nothing."]},"inst-later":{"why":"ESLint is the sibling ticket and it may bring a formatting-adjacent rule set. Deciding after it removes one ordering risk.","rel":[["surf-gate","conf","A deferred decision puts no command on the aggregator.","argued"]],"notes":["The ordering risk is real but small. ESLint stopped shipping formatting rules years ago, and this repository's ESLint config is an inventory rather than a linter."]},"md-all":{"why":"The 147 Markdown files are the load-bearing half of this repository. Leaving them unformatted leaves most of the documentation outside the check.","rel":[["gr-avoid","conf","Prettier repads every Markdown table, so G41 and G31 go red whatever the code configuration says.","measured","this ticket, probe C1: 2 gate files failed, 3 tests, with singleQuote and printWidth 100 already set"],["gr-first","req","Only a repair of the two table patterns lets every Markdown file be formatted.","measured","this ticket, probe C1"],["fx-exclude","req","The fixture vault notes are Markdown, and formatting them rewrites the frontmatter quoting the adapter contract protects.","measured","this ticket, probe C3: 11 vault notes had title, author, isbn and spine_color requoted"]],"notes":["Measured: Prettier leaves the unparseable-YAML fixture structurally intact. It cannot parse the broken frontmatter, so it passes it through and touches only the body prose.","Measured: the Markdown changes are emphasis markers, a blank line after every heading, and table repadding. Prose is not rewrapped, because proseWrap defaults to preserve.","⚠️ **markdownlint is the other tool on this ground, and #235 adopted it.** Measured with markdownlint 0.41.1 against `docs/gates.md` in both forms — MD060 at its default `style: any` reports **0** violations for either, so it permits Prettier's tables and holds no spacing stable. At `style: compact` Prettier's output scores **318**, a straight conflict. At `style: aligned` the tree as it stands today scores **384**, so that style is not a free swap.","markdownlint ships `style/prettier.json`, whose comment reads *\"Disables rules that may conflict with Prettier\"*. It disables 23 rules. MD060 is **not** on the list, which independently confirms the measurement above.","⚠️ **`emphasis-style` (MD049) is on that list, and it still does not collide at its default.** Measured: MD049's `style` defaults to `consistent`, evaluated per file. Prettier flips every `*word*` to `_word_`, so a formatted file is uniformly underscore and scores **0**. At `asterisk` it scores **324**. The two fixtures carry 161 asterisk / 0 underscore and 1 / 161 respectively, so the flip happened and the rule still passed. Presence on the preset means a rule *can* collide, never that it does at a given setting.","**The general shape, met twice: several markdownlint rules are style-selectors with a permissive default** — MD060 `any`, MD049 `consistent`, MD050 `consistent`. *\"We adopted rule X, therefore property P is protected\"* is unsound for any of them until the style is named.","⚠️ **RETRACTED: this option was credited with repairing a gate hole, and it does not.** The claim was that Prettier normalises `| __G41__ |` to `| **G41** |`, closing a hole `md-none` leaves open. Prettier does normalise it. **The gate-reach benefit is nonetheless zero**, and the retraction is the most useful thing in this cell.","**Measured, three patterns on one four-row table mixing `G1` and `G41` so narrow cells must be padded.** Formatter delta is `after − before`: **`main` (exact space, `**` only) 3/4 → 2/4, delta −1. `gr-first` (loose space, `**` only) 3/4 → 4/4, delta +1. Full repair (loose space, `(?:\\*\\*|__)`) 4/4 → 4/4, delta 0.**","**Read row three against row two.** The formatter's whole contribution was normalising `__G41__` for a pattern that could have matched it directly. **The full repair is the two-part fix this box already recommends**, so the +1 was `gr-first` stopping halfway and then measuring itself. Complete the repair and the gain disappears, while the −1 on the unrepaired gate stays.","**So the honest comparison is `md-none` + full repair at 4 of 4 against `md-all` + full repair at 4 of 4** — and one of those needs a formatter. This option's reach advantage was an artifact. #235 found it; two earlier probes of mine, one unrepresentative and one half-repaired, both missed it.","**What survives for this option: coverage, not correctness.** 147 Markdown files inside the check rather than outside, and one consistent shape for documentation a person reads. Those are real and they are the whole case now.","⚠️ **Taking this option obliges two decisions on #235's roster, and neither is visible from either ticket alone.** Prettier writes emphasis as `_em_` while #235 adopts MD049 at `asterisk`: `prettier --write` and `markdownlint --fix` convert it back and forth, and whichever ran last wins. And MD060 at `compact` cannot coexist with Prettier's alignment. **So Markdown under the formatter means dropping MD049 and re-deciding MD060.**"]},"md-nodocs":{"why":"Only `docs/` holds the tables the brittle gates read. Excluding that one directory keeps the other Markdown formatted.","rel":[["fx-exclude","req","Markdown outside docs/ includes the fixture vault notes, so the fixtures need their own exclusion.","measured","this ticket, probe C3: 11 vault notes rewritten, and the whole suite still passed"]],"notes":["Measured green: 122 files changed, +3404 / −3328, and all 1055 tests passed.","⚠️ It also reformatted `.claude/commands/crfix.md` and `.claude/skills/phase-gate/SKILL.md`. Nothing reads those as text today, and the repository has already been burned once by a committed command nothing gated."]},"md-none":{"why":"Excluding Markdown removes every gate break in one move and cuts the reformat commit to a third of its size.","rel":[["fx-md-only","conf","Every Markdown file is already excluded, so a rule that names the vault notes alone adds nothing.","argued"]],"notes":["Measured green: 100 files changed, +3197 / −3132, all 1055 tests passed, plus `pnpm build` and `pnpm gate:public`.","⚠️ The honest cost: 147 Markdown files stay outside the check, and this repository's documentation is load-bearing. The formatter then covers TypeScript and JSON only.","The Markdown half is not lost. It is markdownlint's ticket, #235, now closed and adopted.","**This option is the one that cannot fight markdownlint**, because Prettier never opens a Markdown file. Any MD060 style is then free, including `compact`, which is the only style that keeps G41's and G31's input at one space.","⚠️ **It does not follow that MD060 protects those two gates today.** #235's resolution claims it is *\"the only thing in the repo that holds their input stable\"*, and that holds only at `style: compact`. Measured: the default `any` accepts both spacings, and #235's resolution names no style. Under this option the exposure is latent rather than live — nothing here repads a table — but it is the reason `gr-first` is worth taking even alongside `md-none`.","**#235 confirmed the gate half independently**: G41's and G31's regexes, run byte-for-byte against each table form, match **compact only**. Aligned, tight and internally-mixed all extract nothing. So at MD060's default an aligned table passes the linter *and* vanishes from both gates.","⚠️ **This option is load-bearing for one reason, not two.** #235 suggested it also keeps MD049 from fighting Prettier. Measured, that collision does not exist at MD049's default — see the `md-all` cell. #235 has since retracted the two-reason claim: the rule it needed was MD050, and #235 adopts MD049.","**A row written `| __G41__ |` renders identically to `| **G41** |` and is invisible to G41's regex.** That is a real hole and it is not this option's fault: the **full repair closes it at 4 of 4 with no formatter at all**, measured. An earlier note here said this option sits at 3 of 4 permanently while `md-all` reaches 4. That was measured against a half-finished repair and is withdrawn — see the `md-all` cell.","⚠️ **MD050 at `asterisk` is never redundant, under any configuration of this box.** It costs 0 findings on this tree, and no formatter substitutes for it once the repair is complete. #235 reached the same conclusion by a different route — the MD060-versus-alignment conflict — which is still real and still owed to anyone who reverses this exclusion, but is no longer the reason."]},"md-later":{"why":"Adopt for code now, and add Markdown once the two table patterns are repaired.","rel":[["blame-ignore","conf","A second reformat arrives later, so one ignored revision does not cover the churn.","argued"]],"notes":["The file can list two revisions, so this conflict is cheap to clear. It is listed because a deferred second commit is the one people forget to record."]},"cfg-default":{"why":"No configuration file is the smallest thing to explain. A newcomer needs no repository knowledge to predict the output.","rel":[["gr-avoid","conf","The default quote style flips 9,490 single-quoted strings to double, and G14 and G45 hardcode a single quote.","measured","#231: 4 gates failed, 7 tests; this ticket confirmed the mechanism by removing it"],["gr-first","req","Defaults break four gates, so all four patterns need repair first.","measured","#231"]],"notes":["Measured cost: 348 files changed, +22669 / −16591 under #231's whole-tree run."]},"cfg-two":{"why":"Two overrides match the shape the tree already has. They shrink the commit and remove two of the four gate breaks.","rel":[["blame-ignore","req","The configuration still rewrites 100 files in one commit, so blame still needs the revision recorded.","measured","this ticket, probe C2: 100 files changed, +3197 / −3132"]],"notes":["Measured, singleQuote: 9,490 single-quoted strings against 661 double-quoted in the TypeScript. The tree already votes.","⚠️ Measured, printWidth: 80 changes 169 TypeScript files, 100 changes 90, and 120 changes 127. 100 is the minimum, and 120 is worse than 100 because Prettier rejoins lines that people wrapped near 80.","Both overrides are descriptive rather than inventive. Each records what the tree does, so neither needs repository knowledge to predict."]},"cfg-many":{"why":"A long override list makes the reformat commit as small as possible.","rel":[["surf-gate","conf","A long list makes the output unpredictable without reading the file, so the remedy stops being reachable for a stranger.","argued"]],"notes":["The map's own precedent applies. A gate whose remedy needs repository knowledge is a tax rather than a gate."]},"gr-first":{"why":"Repairing the four patterns removes the brittleness itself, rather than arranging the formatter around it.","rel":[],"notes":["This is what #229's resolution assumed: *adoption repairs those four first, or it is not adoption*. This ticket's measurement shows the assumption is avoidable, not wrong.","The repair is small. Four other gate files already use a `['\"]` character class, so the pattern to copy is in the same directory.","**Measured, 2026-08-23, on branch `research/236-maximal`.** All four patterns were repaired, and the repair alone is green: 1055 tests, no reformat. Then the whole tree formatted with Markdown included and the plugin on, and the whole contract stayed green — 1055 tests, `build`, `gate:public`, `smoke:render` — at 232 files changed, +4834 / −4165. **`gr-first` unlocks `md-all`, demonstrated rather than argued.**","⚠️ The minimal repair loosens the four regexes. The better repair for the two table gates is `tableCells()` in `gates/repo.ts`, which trims each cell and is padding-agnostic by construction. That helper is why G19 and the trend-layer gate read the same repadded table and stayed green in #231.","⚠️ **Measured: this repair closes the padding class and leaves the emphasis class open.** The repaired G41 pattern still hardcodes `\\*\\*`, so a row written `| __G41__ |` scores **0** against both the original and the repaired pattern. `tableCells()` does not help either — it trims a cell and hands the caller a string the caller still matches with asterisks.","**So the honest class fix is two changes, not one:** read cells through `tableCells()`, and match `(?:\\*\\*|__)` or strip the markers before matching. Found by #235 while applying this box's own generalisation back to its own claim.","⚠️ **Doing only half of it is not merely incomplete — it distorts the next measurement.** The half repair reads 4 of 4 on formatted Markdown and 3 of 4 on unformatted, which credits the formatter with a win the full repair takes for free. Two probes in this ticket reported that win before #235 caught it. **A fix that closes the half you were looking at reads as a fix for the whole thing, and a probe built from that half will agree with you.**"]},"gr-avoid":{"why":"A configuration exists that breaks no gate at all, so adoption needs no change to any gate.","rel":[["cfg-two","req","Only the two overrides keep G14 and G45 green, because both patterns hardcode a single quote.","measured","this ticket, probe C1 against #231"],["md-all","conf","Formatting every Markdown file repads the tables G41 and G31 read.","measured","this ticket, probe C1"]],"notes":["⚠️ It freezes the trap rather than removing it. G14 still reddens for a contributor who writes a double-quoted string, and the message still reads *extraction found 0 CLI subcommands*.","#229 named that accidental quote gate as the measured reason style rules may gate here. Dodging keeps the reason and declines the repair."]},"gr-avoid-plus":{"why":"Take the configuration that breaks nothing, and still repair the two quote patterns. Adoption stays green, and the trap goes away.","rel":[["cfg-two","req","The overrides are what keep the two quote gates green while the repair lands.","measured","this ticket, probe C1"],["md-all","conf","A quote-class repair does not help the two table patterns, so every Markdown file still reddens G41 and G31.","measured","this ticket, probe C1"]],"notes":["The repair and the formatter are then independent. Neither one needs the other to be correct, which is why the two changes may land in either order.","⚠️ It is two changes in one adoption, and the map says a ticket plans rather than adopts. The implementation session decides whether they share a commit."]},"gr-after":{"why":"Land the formatter, accept the red, and repair in a follow-up.","rel":[["surf-gate","conf","The aggregator is the required check, so a red tree between the two commits has no mergeable state.","sourced",".github/workflows/gates.yml: `gates` is the single required status check on main"]],"notes":[]},"fx-exclude":{"why":"The fixture vault stands in for a real Obsidian vault no formatter will ever reach. Formatting it makes the stand-in stop resembling the real thing.","rel":[],"notes":["The adapter contract in `AGENTS.md` promises that key order, quoting, comments and the note body survive byte for byte. A formatter rewrites the quoting that sentence names.","Measured: nothing fails when the fixtures are formatted. The whole suite passed, and `pnpm gate:public` passed. The argument is fidelity, not breakage.","Measured: the exclusion also removes 15 cached provider JSON responses from the formatter. Those are recorded API output, and reformatting a recording is the same category of error."]},"fx-format":{"why":"The fixtures are source in this repository, so a rule that skips them is a rule with an exception.","rel":[["md-none","conf","The vault notes are Markdown, so a rule that excludes every Markdown file cannot also format them.","argued"]],"notes":["⚠️ Measured damage, which no test catches: 11 vault notes had `title`, `author`, `isbn`, `url`, `asin` and `spine_color` requoted from double to single.","Measured survival: the deliberately unparseable fixture kept its broken frontmatter. Prettier cannot parse it, so it passes it through and edits only the body prose."]},"fx-md-only":{"why":"The vault notes carry the fidelity argument. The cached JSON does not, so only the notes need protection.","rel":[["md-none","conf","Excluding every Markdown file already excludes the vault notes, so this rule states nothing new.","argued"]],"notes":["It is a real option only when Markdown is otherwise formatted. Against `md-none` it is redundant, and against `md-nodocs` it is the minimum honest exclusion."]},"fx-generate":{"why":"`pnpm fixtures:50` already generates a 50-book vault. Extend that to the seed vault and the committed notes stop existing.","rel":[["md-none","conf","Generated notes are build output rather than source, so no Markdown rule reaches them either way.","argued"]],"notes":["⚠️ It defeats the fixtures. The seed vault holds two files that are broken on purpose, and a generator writing deliberate breakage by rule is a second parser to trust.","It also destroys the property this row is about. A committed note is a hand-edited note, and invariant 5 says hand-edited notes are first-class."]},"astro-plugin":{"why":"The plugin gives Prettier a parser for the `.astro` extension, so the site's markup and styles join the check.","rel":[["inst-editorconfig","conf","It is a Prettier plugin, and an .editorconfig file has no parser to extend.","argued"],["inst-none","conf","A plugin needs a formatter to plug into.","argued"],["inst-later","conf","A deferred instrument has no plugin list to add to.","argued"]],"notes":["It is a new dependency, and `AGENTS.md` requires a record under `docs/adr/` for one.","It also formats the CSS inside those files, which is every stylesheet rule this repository has. That is real coverage, not a rounding error.","Measured, 2026-08-23: the plugin changes 37 lines across the 4 files. The whole contract stayed green — 1055 tests, `build`, `gate:public` and `smoke:render`.","⚠️ **That green is worth less than it looks, and G7 is a fifth gate this breaks.** Found by #238. `Shelf.astro`'s script block today is one import and `start();` — one non-import statement. G7's own header describes the shape it was written for as *two lookups, one guard, one call*, and that shape is no longer in the tree. Formatting a degenerate block proves almost nothing.","⚠️ **Measured here at `printWidth: 100`, which is this box's recommendation rather than #238's default 80.** G7's `GUARD = /^if\\s*\\(.*\\)\\s*\\{$/` needs the whole condition on one line. A two-element guard is 75 characters, survives formatting, and G7 passes 5/5. A **three**-element guard is 108 characters, Prettier splits it over five lines, and G7 fails 2 of 5. The planted block is green before formatting and red after, so the formatter is the whole cause.","⚠️ **The second failure is the worse one: G7's cap counts lines, not statements.** `block.lines` is `split('\\n')` filtered for non-empty, so one split guard becomes five. The planted block holds **5** real statements against a cap of 6 and is reported as **9**. Its message reads *\"Move the bootstrap into a .ts module\"*, which names the wrong cause — nobody added logic, the formatter added newlines.","**This is a trap rather than a break.** Nothing is red today. It arms for whoever adds a third element, which G7's header explicitly invites: the cap of 6 *\"leaves room for one more element\"*. `printWidth: 100` buys about twenty characters of headroom over 80 and does not remove it.","⚠️ Measured, and it is the one change of a kind Prettier never makes elsewhere: the plugin rewrote `<span … set:html={markSvg}><\/span>` to a self-closing `<span … />`, and moved three comments off the line of the tag they hug. Astro compiles the self-closing form correctly and the brand SVG still reaches `dist/index.html`, so this is a recorded hazard rather than a fault.","The hazard has a name: this plugin edits markup semantics, while the rest of the formatter edits code tokens. `smoke:render` is what would catch a real one.","**So taking this option honestly means repairing G7 in the same change** — make `GUARD` tolerate a wrapped condition, and count statements rather than lines. That is the same shape as `gr-first` one row over: the formatter is fine and the gate reading it is brittle."]},"astro-leave":{"why":"Four files and 979 lines stay hand-formatted. The hole is small, named, and honest.","rel":[],"notes":["Measured: zero `.astro` files changed under every configuration probed. Prettier skips them silently, with no warning and no error.","⚠️ Silence is the hazard, not the hole. `pnpm format` reports success while it never opened a quarter of the site's source, and nothing says so.","This repository already treats `.astro` as an unchecked population: `astro check` cannot run under TypeScript 7, which is why no logic may live in those files. The formatter hole falls in the same place, and #238 is the ticket that owns it.","**Measured support arrived from #238, and it is the strongest thing holding this cell.** Adding the plugin arms a G7 failure for whoever next writes a three-element guard, and the red they get says *\"Move the bootstrap into a .ts module\"* — the wrong cause. Leaving `.astro` out costs four unformatted files and arms nothing.","**The four files are also the least valuable population to format.** G7 exists to keep logic out of them, so what a formatter would tidy there is markup a human reads and 979 lines that no longer hold a program."]},"astro-refuse":{"why":"A check that covers part of a tree and reports success reads as covering all of it.","rel":[["surf-gate","conf","Partial coverage disqualifies no other gate here, so refusing on those grounds refuses the aggregator's whole roster.","argued"]],"notes":["The shape of the objection is real and `docs/gates.md` keeps a list of it. The remedy is a documented hole rather than a refusal."]},"blame-ignore":{"why":"One commit is honest about what happened, and the ignore file keeps `git blame` pointed at the real author.","rel":[],"notes":["The file needs the commit's own hash, so it lands in a second commit immediately after the reformat.","GitHub reads `.git-blame-ignore-revs` from the default branch automatically. A local user runs `git config blame.ignoreRevsFile .git-blame-ignore-revs` once, and that line belongs in `CONTRIBUTING.md`."]},"blame-raw":{"why":"One commit, and nothing else. The mitigation is a file most people never configure locally.","rel":[],"notes":["⚠️ Nothing in this box rules it out. The ignore file costs two lines and one command, so the case against it is cost rather than consistency.","It is the option that quietly loses information. Blame is how this repository's reasoning is recovered, and 100 files is a large share of it."]},"blame-split":{"why":"Smaller commits are easier to review, and each package's reformat lands with the people who know it.","rel":[["surf-gate","conf","The workflow is never path-filtered, so every pull request checks the whole tree and the check stays red until the last split lands.","sourced",".github/workflows/gates.yml: *It is never path-filtered ... Every push runs the whole thing.*"]],"notes":["There is one contributor, so the review argument buys little here.","A split is possible with the check added last. That reorders the adoption rather than splitting it."]},"surf-gate":{"why":"The aggregator blocks the merge and admits any stranger. The remedy is one command that needs no repository knowledge.","rel":[["inst-editorconfig","conf","The aggregator runs a command, and an .editorconfig file provides none that checks or fixes.","argued"],["inst-none","conf","With no tool, the aggregator has nothing to run.","argued"],["inst-later","conf","A deferred instrument puts no command on the aggregator.","argued"]],"notes":["The command must be documented in `docs/commands.md` in the same commit. G14 holds that list and `package.json` to each other in both directions.","⚠️ `prettier --check` reports every offending path and one instruction. That is the clearest remedy any check on this aggregator carries."]},"surf-hook":{"why":"A hook fixes the file before the commit exists, so no pull request ever carries a formatting diff.","rel":[["blame-ignore","conf","A hook nobody must install lets the tree drift, so no single reformat commit exists to record.","sourced",".githooks/pre-commit: *Nothing in `pnpm install` wires this, no gate runs it, and a contributor who never opts in never meets it.*"]],"notes":["This repository already carries an opt-in hook, and its own comment warns that `core.hooksPath` has one slot. A second hook competes for it.","#229 settled the shape: a hook shifts the fix left and enforces nothing, so the gate is still required. A hook is an addition, never a substitute."]},"surf-refuse":{"why":"Record the reasoning in `docs/gates.md` under *Not gated, deliberately*, where eight refusals already live.","rel":[["inst-prettier","conf","A formatter nothing runs is a dependency with no check behind it.","argued"]],"notes":["This is the honest partner of *neither*. If the answer is no, the refusal has a home and a shape already."]}},"suspected":["`inst-editorconfig` conflicts with `md-none`: an .editorconfig file cannot repad a Markdown table, so the two never meet. Dropped because it states a coverage fact rather than a conflict.","`fx-exclude` requires `blame-ignore`: excluding the fixtures shrinks the reformat commit. It shrinks it to 100 files, which still needs the ignore file, so the requirement does not hold.","`astro-leave` conflicts with `surf-gate`: the gate reports success over files it never opened. Dropped to `suspected` because every gate here has a scope, and a scope is not a conflict. The hazard is recorded in the option's notes instead."],"presets":[{"title":"As recommended","text":"Prettier with two overrides, no Markdown, no fixtures, gated on the aggregator. Measured green: 100 files, all 1055 tests, build and public-build gate.","steps":[{"label":"Start from the recommendation","reset":true,"view":"findings"},{"label":"Why two overrides and not defaults","open":"config"},{"label":"What happens to the four brittle gates","open":"gaterepair"},{"label":"Back to the findings","open":null,"view":"findings"}]},{"title":"The .editorconfig strawman run","text":"The ticket asks whether this is simply the right answer. Select it and read what switches off. It is consistent, and the measurement says it can never go red.","steps":[{"label":"Start from the recommendation","reset":true,"view":"findings"},{"label":"Switch to .editorconfig only","set":{"instrument":"inst-editorconfig"}},{"label":"Read what the aggregator would check","open":"surface"},{"label":"Read what blame no longer needs","open":"blame"}]},{"title":"The break test: Prettier's defaults","text":"The configuration row is the most connected one. Set it to defaults and watch four gates and a 348-file commit arrive together.","steps":[{"label":"Start from the recommendation","reset":true,"view":"findings"},{"label":"Drop the two overrides","set":{"config":"cfg-default"}},{"label":"Read the cascade into the gate row","open":"gaterepair"},{"label":"Now add every Markdown file too","set":{"markdown":"md-all"}},{"label":"Read the fixture requirement it pulls in","open":"fixtures"}]},{"title":"Adopt nothing","text":"The map calls refusal a first-class result. Select it and check whether anything in this box argues against it.","steps":[{"label":"Start from the recommendation","reset":true,"view":"findings"},{"label":"Refuse the formatter","set":{"instrument":"inst-none","surface":"surf-refuse"}},{"label":"Read where the refusal is recorded","open":"surface"},{"label":"See the whole grid at once","view":"sheet"}]}]};
