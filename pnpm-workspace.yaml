packages:
  - 'packages/*'

# pnpm blocks postinstall scripts by default; these need theirs to work.
# esbuild: required by vite/vitest/astro — without its postinstall the binary is missing.
# sharp: native image pipeline — dominant-colour extraction (phase 1) and the OG
# image (phase 3). Needs its install script to fetch the platform binary.
allowBuilds:
  esbuild: true
  sharp: true

# pnpm 11 defaults this to `install`, which makes `pnpm test` try to reinstall
# node_modules first — and that aborts outright with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY wherever there is no TTY to confirm
# the purge, which is every agent shell and every CI runner. `warn` keeps the
# staleness diagnostic and stops it from blocking the command you asked for.
# CI is unaffected either way: it installs from scratch against a frozen lockfile.
verifyDepsBeforeRun: warn

# GHSA-2v37-7h3g-55p8, high: nanoid <3.3.18 loops indefinitely on a custom
# generator. It arrives four ways, all of them vite>postcss, and postcss@8.5.25
# already asks for `^3.3.17` in its own latest release — so this override looks
# redundant and is not.
#
# ⚠️ The range moved and the id did not. This block first read `<3.3.17` and
# pinned `^3.3.17` to match it exactly. On 2026-08-15 CI went red on an
# **unchanged lockfile**: GHSA-2v37-7h3g-55p8 was amended upstream to `<3.3.18`,
# so the same advisory that this override was written to answer now covers the
# version it pins. Nothing in the tree changed and nothing new was published —
# only the claim about what is vulnerable. An advisory id is not a stable
# statement of scope, and a pin written to satisfy one exactly is one amendment
# from being insufficient. That is the argument for `^3.3.18` over `3.3.18`:
# a caret still admits the next patch without a second red build.
#
# pnpm 11 quarantines newly published versions for seven days by default
# (`minimumReleaseAge`), which is a supply-chain policy worth having: it is the
# window in which a compromised release gets caught. The cost is that resolution
# silently declines a *security* patch inside that window. nanoid 3.3.17 shipped
# 2026-08-03 and 3.3.18 on 2026-08-07, so on 2026-08-08 `pnpm update nanoid`
# reported success and left the tree on the vulnerable 3.3.16. An explicit
# override is honoured where auto-resolution is not — the policy governs which
# version pnpm will *pick*, not one it is told to use.
#
# ⚠️ That cost is why `^3.3.17` did not quietly pick up 3.3.18 on its own. The
# caret admitted it from 2026-08-07, and quarantine withheld it until 2026-08-14
# — one day before the amendment made it required. The window and the amendment
# are independent, and the gap between them is the whole of this incident.
#
# So this is deliberately not an `auditConfig.ignoreGhsas` entry. That hatch is
# for an advisory with no fix published; here the fix existed and only needed
# naming. Remove this the moment the tree carries 3.3.18 without help, which
# happens as soon as a postcss release requiring `^3.3.18` reaches the lockfile.

# GHSA-q8mj-m7cp-5q26, moderate: qs 6.11.1–6.15.1 throws a TypeError on
# null/undefined entries in comma-format arrays under `encodeValuesOnly`, which
# is a remotely triggerable crash for anything parsing untrusted query strings.
# It arrives one way — `@stryker-mutator/core` > `typed-rest-client` — and that
# package pins `qs` at exactly `6.15.1`, so there is no update path at Stryker 9
# and no `pnpm update` that reaches it. Stryker 10 is the version whose
# `typed-rest-client` 3.x carries `qs` 6.15.3 on its own — which two later
# advisories have since made insufficient, see below; taking a major bump of
# the mutation runner to answer a moderate advisory is the larger risk, and G38
# scores every scope it would move.
#
# ⚠️ **Nothing in CI was ever going to catch this.** `pnpm audit` runs at
# `--audit-level=high` (see the note at the foot of this file), so a `moderate`
# passes it by construction — the `audit` job was green on every red build this
# week. It surfaced as a GitHub Dependabot alert, which is a different
# instrument reading a different threshold, and the two disagreeing is the
# normal case rather than a fault.
#
# ⚠️ **That warning came true, and this block was raised from `^6.15.2` to
# `^6.16.0` because of it.** GHSA-x5fp-wj9c-mxmx names 6.15.3 vulnerable and
# GHSA-4mjr-xmp4-gh2g covers everything below 6.16.0 — so the caret admitted a
# fix and there was none published above it, exactly the shape the sentence
# above predicts. Both are moderate, so `pnpm audit --audit-level=high` was
# green throughout. [#318](https://github.com/mephistopheles4/stacks/issues/318).
#
# ⚠️ **The old escape route no longer works, and it is corrected rather than
# deleted.** This block used to say: remove the override when Stryker's
# `typed-rest-client` reaches 3.x and the lockfile carries a fixed `qs` unaided.
# `typed-rest-client` 3.1.0 pins `qs` at **6.15.3**, which the first advisory
# above names as vulnerable, so that bump now fixes nothing. **There is no
# version of `typed-rest-client` that resolves this** — 2.3.1 pins `6.15.1` and
# 3.1.0 pins `6.15.3`, both exact, so no release above either pin is ever
# declared-compatible and an override is the only mechanism there is.
#
# ⚠️ **Which means this forces a combination the package does not declare, and
# that was measured rather than hoped.** `typed-rest-client` touches `qs` at one
# line — `Util.js`, `qs.stringify(params, buildParamsStringifyOptions(...))` —
# and 6.15.3 and 6.16.0 produce byte-identical output across all three option
# sets that function can build and eight parameter shapes (arrays, nesting,
# dots, spaces, unicode, empties, mixed), with a deliberately mismatched control
# proving the comparison could see a difference. `pnpm test` and a full
# `pnpm mutation:run` both pass on 6.16.0. The tree was already forcing 6.15.3
# onto a package pinning 6.15.1; this is the same act, one line further.
#
# This deliberately reaches every `qs` in the tree rather than the scoped
# `typed-rest-client>qs`. There is exactly one today, and the bare form keeps a
# second arrival from landing on the vulnerable line unnoticed — the failure the
# nanoid entry describes, where a pin was correct and the tree moved anyway.

# GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
# GHSA-5jgf-p345-68v8, all high: `fast-uri` below 3.1.6 normalises malformed
# IPv6 literals, percent-decodes a hostname repeatedly, and normalises a
# percent-encoded scheme — three ways for a parsed URI to name a host the caller
# did not mean, which is server-side request forgery in anything that fetches
# what it parsed. Four advisories, one package, one fix.
#
# It arrives five ways and is **always under `ajv`**: `@stryker-mutator/core`,
# `@stryker-mutator/vitest-runner` through it, and `@astrojs/check` >
# `@astrojs/language-server` > `volar-service-yaml` > `yaml-language-server`.
# Nothing here depends on it directly, and no first-party code calls it — it is
# the JSON-schema validator inside the mutation runner and the Astro type
# checker. That bounds the blast radius; it does not answer the gate, which reads
# the tree rather than the call graph.
#
# ⚠️ **`ajv` asks for `^3.0.1` and its newest release still does** — 8.20.0, the
# latest on the 8 line, carries the same floor as the 8.18.0 the tree resolves.
# So nothing in the dependency graph states that 3.1.6 is required, and a fresh
# resolution is free to land anywhere in the vulnerable range. This override is
# the floor, and it is the only one there is. Remove it when `ajv` raises its own
# to `^3.1.6` and the lockfile carries a fixed line unaided.
#
# `^3.1.6` rather than `3.1.6`, for the reason the nanoid block above it learned
# the hard way: an advisory's range is not a stable statement of scope, and a pin
# written to satisfy one exactly is one amendment from being insufficient. It
# resolves to **3.1.7**, published 2026-09-02.
#
# ⚠️ **pnpm's seven-day `minimumReleaseAge` quarantine is not in play here, and
# it was checked rather than assumed** — that is the trap the nanoid block
# records, where `pnpm update` reported success and left the tree vulnerable.
# 3.1.6 shipped 2026-08-23, so the fix was outside the window before this was
# written.
#
# ⚠️ **A plain update reaches the fixed line today, and this override still is
# not redundant** — measured, not guessed: `pnpm update fast-uri --recursive`
# lands 3.1.7 on its own. What it does not do is leave anything saying why, so
# the next resolution against `^3.0.1` has nothing to hold it above 3.1.5. A
# lockfile is a record of what was picked; this is the statement of what may be.
# Bare rather than the scoped `ajv>fast-uri`, for the qs block's reason: there is
# one arrival today, and the bare form keeps a second from landing on the
# vulnerable line unnoticed.
#
# ⚠️ **Raised from `^3.1.6` to `^3.1.8` on 2026-10-02, and 3.1.7 above is no
# longer what it resolves to.** GHSA-hrr3-gc8f-f4qj, moderate: below 3.1.8 a
# percent-encoded octet in the host escapes case normalisation, so two spellings
# of one host compare unequal — the same family as the four above. The floor
# this block wrote admitted 3.1.7, which the new advisory names, so the nanoid
# lesson repeated on the one entry written to have learned it: a caret is a floor
# for the advisories known on the day. Moderate, so `--audit-level=high` was
# green throughout. 3.1.8 shipped 2026-09-15, outside the quarantine window, and
# `pnpm update fast-uri --recursive` reached it unaided.

# GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7, high, and GHSA-q2hr-2g5m-vwhr,
# moderate: `brace-expansion` 4.x and 5.x recurse without bound on nested brace
# groups below 5.0.10 and 5.0.11 respectively, and go quadratic on the `{a},b}`
# rewrite below 5.0.12 — a stack overflow or a stalled CPU for anything
# expanding an untrusted glob. It arrives only through `minimatch`, under
# eslint, the typescript-eslint family, sonarjs and Stryker. Every glob those
# expand is written in this repository, so nothing untrusted reaches it; that
# bounds the blast radius and does not answer the gate.
#
# ⚠️ **The two highs were published 2026-09-29, after `main`'s last `gates` run
# on 2026-09-27**, so every pull request opened since would go red on `audit`
# with no diff of its own — the smol-toml shape, where the advisory is what is
# new. It is the fast-uri block's situation otherwise: `minimatch` asks for
# `^5.0.8`, so its own floor admits the vulnerable line, and `pnpm update
# brace-expansion --recursive` lands 5.0.12 unaided (published 2026-09-14,
# outside the quarantine window). This is the statement that holds it there.
# Remove it when `minimatch` raises its floor to `^5.0.12`. Caret for the nanoid
# block's reason.
#
# ⚠️ **Scoped to the 5.x line, unlike its neighbours, and on purpose.** The
# advisories also cover 1.x through 4.x, and 1.x and 2.x — what minimatch 3 and
# most minimatch 9 releases ask for — ship as a single CommonJS `index.js` where
# 5.x is a dual ESM/CommonJS package. A bare entry would force such a consumer
# across that major, likely breaking the tool rather than protecting it, and
# nothing measured that it would not. Only 5.x is in the tree
# today. A second 5.x arrival is still held by this entry; an older line
# arriving vulnerable is caught by `audit` instead, which is the louder failure.
#
# GHSA-68fv-2mgg-jv7q, high: `source-map-js` 1.0.0 to below 1.2.2 lets an
# indexed source map's section offsets stall the event loop. It arrives fifteen
# ways — vitest, Stryker and astro, all through `postcss` or `magicast` — and is
# a build-time tool in every one: nothing first-party calls it, and the maps it
# reads are the ones this repository's own toolchain emits. That bounds the blast
# radius; it does not answer the gate, which reads the tree rather than the call
# graph.
#
# ⚠️ **The advisory landed after `main`'s last `gates` run**, so every pull
# request opened since goes red on `audit` with no diff of its own. The fix,
# 1.2.2, shipped 2026-09-30 and is outside the seven-day window. The consumers
# in the tree ask for lower floors — `magicast` 0.5.5 and the `css-tree` pair
# for `^1.2.1`, which admits the vulnerable line — and the newest `postcss`
# already asks for `^1.2.2` while the tree resolves an older one. Nothing in the
# graph states that 1.2.2 is required, so this is the floor. Remove it when
# every consumer's own floor is `^1.2.2` and the lockfile carries a fixed line
# unaided. Caret for the nanoid block's reason; bare, for the qs block's.

# GHSA-ch52-4w7c-c8xp, high: `http-cache-semantics` up to 4.2.0 can disclose a
# cached response to a different user through its `max-stale` handling. It
# arrives one way, `astro`, which declares `^4.2.0`. It is a build-time
# dependency of the site's toolchain and ships to no visitor, and no first-party
# code calls it — that bounds the blast radius; it does not answer the gate.
#
# ⚠️ **There is no 4.2.1.** `pnpm audit` reports the patched range as `>=4.2.1`,
# and the only fix published is 4.3.0, a minor released 2026-10-04. That is
# **inside the seven-day window this repository applies by hand** — nothing here
# sets `minimumReleaseAge` — so waiting it out would leave `main` red. It is
# taken anyway, on the nanoid block's precedent: a security fix is named
# explicitly rather than waited out. 4.3.0 sits within astro's own declared `^4.2.0`, so
# this does not force a combination the package does not declare. Remove it when
# `astro` raises its floor to `^4.3.0`.

# GHSA-r4xh-jqrq-34v2, moderate: `smol-toml` 1.8.0 and below parses quadratically,
# rescanning to the end of the document on each key line. It arrives one way,
# `markdownlint-cli2`, which pins **exactly** `1.8.0` — so, as with `qs`, no
# release above the pin is declared-compatible and an override is the only
# mechanism there is. It is moderate, so `--audit-level=high` is green with or
# without this; it is taken because the entry here was removed on the grounds
# that 0.23.3 had fixed it, and it had not.
#
# ⚠️ **That earlier note was wrong, and it is corrected rather than deleted.**
# This block used to be gone, with a line saying `markdownlint-cli2` 0.23.3 pins
# 1.8.0 and that was its removal condition met. 1.8.0 is itself vulnerable; the
# condition was the pin moving *past* 1.8.0, and it never did.
#
# ⚠️ **Crossing the exact pin is a combination the package does not declare, and
# what was shown is narrower than "it works".** `pnpm lint:md` over the tracked
# tree reports the same findings before and after (0 issues in 0 files, 186
# files), and a planted violation is still reported under the override — so
# 1.9.0 loads under `markdownlint-cli2` and the linter is unaffected. **Parse
# behaviour was not exercised**: `markdownlint-cli2` calls `smol-toml` only for a
# `.toml` config file or an inline configure-file comment, and this repository
# has neither. If one is ever added, check it parses. Remove this when
# `markdownlint-cli2` pins `smol-toml` at 1.9.0 or later.
overrides:
  nanoid: '^3.3.18'
  qs: '^6.16.0'
  fast-uri: '^3.1.8'
  'brace-expansion@5': '^5.0.12'
  source-map-js: '^1.2.2'
  http-cache-semantics: '^4.3.0'
  smol-toml: '^1.9.0'

# CI fails on a `high` or `critical` advisory (`pnpm audit --audit-level=high`).
#
# When one lands in a transitive dependency with no fix published, it will block
# every unrelated merge, and the honest response is to say so here rather than
# to lower the threshold. An entry needs the GHSA id, the date, and why it does
# not reach this project — a local-first CLI with no server and no untrusted
# input beyond three metadata APIs rules out a lot of advisory classes. Remove
# the entry the moment a fix ships; a permanent ignore is a decision nobody
# revisits.
#
# ⚠️ **The date is read by a gate, so it is not free text.** It must be the
# first token after `#`, as YYYY-MM-DD followed by a comma. An entry expires
# 30 days after that date (G62, `gates/ignored-advisories.test.ts`): renew it
# with a new date and a fresh reason, or remove it. An entry with no readable
# date fails; so does a flow-style list or a quoted id. And a stable version of
# the package published outside the advisory's affected range turns the
# `audit` job red (G63, `scripts/check-ignored-advisories.ts`), so the upgrade
# replaces the ignore. ADR-0095. Never `pnpm audit --ignore-unfixable`: it
# ignored nothing and wrote `auditConfig: {}` here on 2026-10-06.
#
# auditConfig:
#   ignoreGhsas:
#     - GHSA-xxxx-xxxx-xxxx  # 2026-01-01, <why it cannot reach us>, fix pending
#
# The one live entry, and the repository's first:
#
# GHSA-vfj7-8cjw-p6xm, high, added 2026-10-06: `braces` up to 3.0.3 exhausts the
# stack on deeply nested brace patterns. Path:
# `markdownlint-cli2` > `globby` > `fast-glob` > `micromatch` > `braces`, and
# two shorter routes through the same two packages.
#
# **It cannot reach this project.** Every glob that arrives at `braces` here is
# `markdownlint-cli2`'s own, over tracked docs, written in this repository — no
# untrusted input reaches the pattern. That bounds the blast radius; it does not
# answer the gate, and **nothing published fixes it**: 3.0.3 is `latest` and the
# newest version on npm. GitHub's record has the range `<= 3.0.3` and no patched
# version; the `>=3.0.4` that `pnpm audit` prints is a range pnpm derives, not
# one the advisory states. No override can name a version that does not exist.
#
# ⚠️ **Do not run `pnpm audit --ignore-unfixable`.** On 2026-10-06 it wrote
# `auditConfig: {}` into this file and exited 0, and it did not treat braces as
# unfixable — pnpm took its derived `>=3.0.4` as a fix.
#
# **Remove this when braces 3.0.4 or later is published and reachable.** The
# guards that fail on that, and expire an entry after 30 days, are
# [#405](https://github.com/mephistopheles4/stacks/issues/405); until it lands
# nothing catches this entry outliving its reason.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # 2026-10-06, markdownlint-cli2's own globs only, fix pending
