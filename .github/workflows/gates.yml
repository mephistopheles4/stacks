# The merge gate.
#
# `gates` is the single required status check on main. Two rules keep it honest:
#
#   1. It is never path-filtered. A required workflow that gets skipped reports
#      nothing at all, and a required check that never reports blocks the pull
#      request forever. Every push runs the whole thing.
#   2. `gates` is an aggregator over the `suite` matrix, so the required check
#      keeps one stable name however many Node versions the matrix grows to.
#      Requiring `suite (22)` and `suite (24)` by name would mean editing the
#      branch ruleset every time that list changes.
#
# `pull_request`, never `pull_request_target`: fork pull requests must not see
# repository secrets. Nothing here needs one — and as of G21 nothing here can
# reach the network at all: `gates/no-live-network.ts` replaces `fetch` for the
# whole suite, records any request, and fails the test that made it.
#
# That sentence used to read "the tests inject a fixture-backed HttpGet that
# throws on an unmapped URL, so no live API call is possible", which was false
# for months — the injection covers metadata lookups and stops short of the
# cover bytes, and `enrich.test.ts` really was downloading from
# `covers.openlibrary.org` on every run of this workflow. The trigger choice was
# right for its own reasons; only the reassurance attached to it was wrong.

name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # package.json declares `engines: node >=22`. Running only the version the
    # owner happens to have installed would leave that floor as another
    # documented claim nothing checks.
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    name: suite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # controls the action repository can repoint v7 at anything, and it would
      # run here with the workflow's token. The comment carries the version so
      # the pin stays readable; Dependabot bumps both together.
      #
      # `persist-credentials: false` on every checkout in this file, and it is
      # not ceremony. The default leaves the workflow token in `.git/config`,
      # readable by anything that runs afterwards — and every job here runs code
      # the pull request controls: `pnpm install` executes install scripts, and
      # the `style` job loads `eslint.lint.config.mjs` **from the branch under
      # test**. Nothing in these jobs pushes, so the credential buys nothing and
      # costs a token sitting on disk beside arbitrary code. `contents: read`
      # and `pull_request` (never `pull_request_target`) already bound the blast
      # radius; this closes what they leave. Flagged by zizmor as `artipacked`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must precede setup-node: its `cache: pnpm` needs pnpm already on PATH.
      # No `version` input — the root package.json `packageManager` field pins
      # it, and passing both is the documented way to get a mismatch error.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # CI=true is set by Actions, which makes --frozen-lockfile the default;
      # passing it explicitly means the gate fails on an out-of-sync lockfile
      # rather than quietly resolving a different tree.
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # Phase 3 gate: the public build carries no note bodies. Stages its own
      # fixture vault, so it does not depend on step order.
      - name: gate:public
        run: pnpm gate:public

      # Phase 2 gate: the shelf actually renders. puppeteer-core drives the
      # Chrome stable that ubuntu-latest ships at /usr/bin/google-chrome, which
      # is already in the script's candidate list — no Chromium download.
      # Also stages its own 50-book fixture vault.
      - name: smoke:render
        run: pnpm smoke:render

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shelf-node-${{ matrix.node }}
          path: artifacts/shelf.png
          # `warn`, not `error`: this step runs with `if: always()`, so when the
          # render gate fails there is no screenshot by definition, and erroring
          # here would report a second failure for the same cause and bury the
          # real one. The gate itself is what fails if the shelf will not draw.
          if-no-files-found: warn

  # Known vulnerabilities in the dependency tree.
  #
  # Its own job rather than a step in the matrix: the answer does not depend on
  # which Node version is running, and running it twice would report the same
  # advisory twice.
  #
  # This is the one gate whose result can change without the code changing — an
  # advisory published tomorrow turns yesterday's green commit red. That is the
  # point (a vulnerability is news about code you already shipped), but it also
  # means it can block work on a transitive dependency you cannot fix. The
  # escape hatch is `auditConfig.ignoreGhsas` in pnpm-workspace.yaml, which
  # takes a justification comment and shows up as a reviewable one-line diff —
  # the same shape as the allowlists in gates/.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `high` and above. Moderate advisories in a dev-only dependency of a
      # local-first tool with no server are not worth blocking a merge on; a
      # high or critical one is.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  # The static analysis and style verdicts.
  #
  # Its own job rather than steps in the matrix, for the reason the `audit` job
  # above states: the answer does not depend on which Node version is running,
  # and running it twice would report the same finding twice. A lint verdict is
  # about TypeScript source, so the Node version cannot move it — in the matrix
  # the type-aware run costs about 15 seconds and reports everything twice; here
  # it costs about 7.5 and reports each finding once.
  #
  # ⚠️ **One job, one red, several tools.** As `docs/spec/static-analysis-and-style.md`
  # §4 grows this job, a failure names `style` rather than the tool that failed.
  # The remedy is that each command below is documented and runnable alone, so
  # the job's output *is* the tool's output and the fix command is in it.
  style:
    name: style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tuned type-checked rule set over every .ts file. `pnpm lint --fix`
      # repairs about a quarter of what this can report; the rest is read.
      - name: lint
        run: pnpm lint

  # The required status check. Named `gates` and nothing else.
  gates:
    name: gates
    needs: [suite, audit, style]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every dependency to have passed
        # Each `result` is 'success' only when that job — and, for a matrix,
        # every one of its legs — succeeded. Skipped and cancelled must fail
        # the gate rather than pass it by omission, which is why this compares
        # against 'success' explicitly instead of checking for 'failure'.
        run: |
          echo "suite: ${{ needs.suite.result }}"
          echo "audit: ${{ needs.audit.result }}"
          echo "style: ${{ needs.style.result }}"
          test "${{ needs.suite.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.style.result }}" = "success"
