# The merge gate.
#
# `gates` is the single required status check on main. Two rules keep it honest:
#
#   1. It is never path-filtered. A required workflow that gets skipped reports
#      nothing at all, and a required check that never reports blocks the pull
#      request forever. Every push runs the whole thing.
#   2. `gates` is an aggregator over the `suite` matrix, so the required check
#      keeps one stable name however many Node versions the matrix grows to.
#      Requiring `suite (22)` and `suite (24)` by name would mean editing the
#      branch ruleset every time that list changes.
#
# `pull_request`, never `pull_request_target`: fork pull requests must not see
# repository secrets. Nothing here needs one — and as of G21 nothing here can
# reach the network at all: `gates/no-live-network.ts` replaces `fetch` for the
# whole suite, records any request, and fails the test that made it.
#
# That sentence used to read "the tests inject a fixture-backed HttpGet that
# throws on an unmapped URL, so no live API call is possible", which was false
# for months — the injection covers metadata lookups and stops short of the
# cover bytes, and `enrich.test.ts` really was downloading from
# `covers.openlibrary.org` on every run of this workflow. The trigger choice was
# right for its own reasons; only the reassurance attached to it was wrong.

name: gates

on:
  # ⚠️ **All four events are named because naming any of them replaces the
  # default list rather than extending it.** A bare `pull_request:` takes
  # `opened`, `synchronize` and `reopened`; `edited` is the one G55
  # (`pr-conventions`) needs, since a title is editable in one click and the
  # remedy for its red is exactly that edit. It fires for a body change too,
  # which the body half of that gate needs.
  #
  # ⚠️ **The cost is accepted rather than optimised away.** An `edited` event
  # re-runs the whole workflow, matrix included, because the `gates` aggregator
  # fails on a skipped dependency on purpose — path- or event-filtering the
  # heavy jobs would turn the required check red on every title edit and block
  # every merge.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # package.json declares `engines: node >=22`. Running only the version the
    # owner happens to have installed would leave that floor as another
    # documented claim nothing checks.
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    name: suite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # controls the action repository can repoint v7 at anything, and it would
      # run here with the workflow's token. The comment carries the version so
      # the pin stays readable; Dependabot bumps both together.
      #
      # `persist-credentials: false` on every checkout in this file, and it is
      # not ceremony. The default leaves the workflow token in `.git/config`,
      # readable by anything that runs afterwards — and every job here runs code
      # the pull request controls: `pnpm install` executes install scripts, and
      # the `style` job loads `eslint.lint.config.mjs` **from the branch under
      # test**. Nothing in these jobs pushes, so the credential buys nothing and
      # costs a token sitting on disk beside arbitrary code. `contents: read`
      # and `pull_request` (never `pull_request_target`) already bound the blast
      # radius; this closes what they leave. Flagged by zizmor as `artipacked`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must precede setup-node: its `cache: pnpm` needs pnpm already on PATH.
      # No `version` input — the root package.json `packageManager` field pins
      # it, and passing both is the documented way to get a mismatch error.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # CI=true is set by Actions, which makes --frozen-lockfile the default;
      # passing it explicitly means the gate fails on an out-of-sync lockfile
      # rather than quietly resolving a different tree.
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # Phase 3 gate: the public build carries no note bodies. Stages its own
      # fixture vault, so it does not depend on step order.
      - name: gate:public
        run: pnpm gate:public

      # Phase 2 gate: the shelf actually renders. puppeteer-core drives the
      # Chrome stable that ubuntu-latest ships at /usr/bin/google-chrome, which
      # is already in the script's candidate list — no Chromium download.
      # Also stages its own 50-book fixture vault.
      - name: smoke:render
        run: pnpm smoke:render

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shelf-node-${{ matrix.node }}
          path: artifacts/shelf.png
          # `warn`, not `error`: this step runs with `if: always()`, so when the
          # render gate fails there is no screenshot by definition, and erroring
          # here would report a second failure for the same cause and bury the
          # real one. The gate itself is what fails if the shelf will not draw.
          if-no-files-found: warn

  # Known vulnerabilities in the dependency tree.
  #
  # Its own job rather than a step in the matrix: the answer does not depend on
  # which Node version is running, and running it twice would report the same
  # advisory twice.
  #
  # This is the one gate whose result can change without the code changing — an
  # advisory published tomorrow turns yesterday's green commit red. That is the
  # point (a vulnerability is news about code you already shipped), but it also
  # means it can block work on a transitive dependency you cannot fix. The
  # escape hatch is `auditConfig.ignoreGhsas` in pnpm-workspace.yaml, which
  # takes a justification comment and shows up as a reviewable one-line diff —
  # the same shape as the allowlists in gates/.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `high` and above. Moderate advisories in a dev-only dependency of a
      # local-first tool with no server are not worth blocking a merge on; a
      # high or critical one is.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

      # The workflows themselves, which `pnpm audit` cannot see: it reads the
      # dependency tree and a workflow has none.
      #
      # ⚠️ **This is here because of G55.** A pull request title is
      # attacker-controlled text, this workflow runs on fork pull requests by
      # design, and a `${{ }}` expression in a `run:` step is substituted *before
      # the shell starts* — so a hostile title would run as code. `zizmor`'s
      # `template-injection` audit is the rule that catches it, and it catches
      # it in every workflow added later rather than only in the one whose
      # review noticed. Measured on a probe: the hazard reports as **error /
      # high confidence**, and the `env:` form this file uses reports nothing.
      #
      # ⚠️ **`--min-severity=low` drops 16 informational findings, all of them
      # `steps.*.outputs.*` in `metrics.yml`** — values that workflow produces
      # itself, in a job nothing external triggers. Raising the floor is a
      # judgement about those 16 and about nothing else: every finding of `low`
      # and above is still a red, and the two that exist today carry a written
      # `zizmor: ignore` beside them in `metrics.yml`.
      #
      # ⚠️ **Pinned exact, for ADR-0067's reason**: a release that adds an audit
      # turns an unchanged tree red on whichever unrelated pull request runs
      # after the bump. `pipx` ships on the runner image, so this needs no
      # action pin and no new entry in the npm tree. See ADR-0082.
      - name: zizmor
        run: pipx run zizmor==1.30.0 --no-online-audits --min-severity=low .github/workflows/

  # The static analysis and style verdicts.
  #
  # Its own job rather than steps in the matrix, for the reason the `audit` job
  # above states: the answer does not depend on which Node version is running,
  # and running it twice would report the same finding twice. A lint verdict is
  # about TypeScript source, so the Node version cannot move it — in the matrix
  # the type-aware run costs about 15 seconds and reports everything twice; here
  # it costs about 7.5 and reports each finding once. A Markdown rule break is
  # the same on Node 22 and Node 24 for the same reason.
  #
  # ⚠️ **One job, one red, several tools.** As `docs/spec/static-analysis-and-style.md`
  # §4 grows this job, a failure names `style` rather than the tool that failed.
  # The remedy is that each command below is documented and runnable alone, so
  # the job's output *is* the tool's output and the fix command is in it.
  #
  # ⚠️ **One job, but one row per check.** Each command here takes its own row in
  # docs/gates.md: a job records *where* a check runs, a row records *what* is
  # protected, and the two are not the same thing.
  style:
    name: style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `persist-credentials: false` because nothing in this job speaks to git.
      # `actions/checkout` writes an auth configuration into the checkout by
      # default so later steps can push; this job checks out, installs, and runs
      # a linter. `permissions: contents: read` already bounds what the token can
      # do — this bounds how long it is lying around, which is a different
      # question and the one zizmor's `artipacked` rule asks.
      #
      # ⚠️ **The `suite` and `audit` checkouts do not set it and this comment is
      # not an oversight.** They predate this job and neither pushes either, so
      # the same line belongs on both — as its own change, not as a side effect
      # of adopting a Markdown linter. Raised by CodeRabbit on #264 against all
      # three; only the step that PR introduced was in its scope.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The tuned type-checked rule set over every .ts file. `pnpm lint --fix`
      # repairs about a quarter of what this can report; the rest is read.
      - name: lint
        run: pnpm lint

      # The narrow rule set over tracked Markdown. `pnpm lint:md:fix` repairs
      # the seven rules whose fixes are measured safe here; the rest need a
      # person, on purpose. The command prints that line with the failure.
      - name: lint:md
        run: pnpm lint:md

      # Reports; never writes. `pnpm format` is the remedy and it is named in
      # the failure, which is what lets a style rule onto this aggregator at
      # all — the person who hits the red can clear it without knowing this
      # repository.
      - name: format:check
        run: pnpm format:check

  # G55 — the strings a squash-merge actually lands.
  #
  # This repository squash-merges with `squash_merge_commit_title: PR_TITLE` and
  # `squash_merge_commit_message: PR_BODY`, so the pull request title *is* the
  # commit subject on `main` and its body is that commit's message. The local
  # subject a `commit-msg` hook would lint is the string the squash throws away,
  # which is why this is a job and not a hook.
  #
  # ⚠️ **Every string arrives through `env:`, never through `${{ }}` in the
  # `run:` line.** A title is attacker-controlled text and this workflow runs on
  # fork pull requests; an expression in a script is substituted before the
  # shell starts, so a hostile title would run as code. `gates/pr-conventions.test.ts`
  # refuses any `run:` step here that interpolates event data, and the `zizmor`
  # step in the `audit` job generalises it to every workflow added later.
  #
  # ⚠️ **No job-level `if:`, on purpose.** The workflow also runs on `push` to
  # main, where there is no pull request to read — and the `gates` aggregator
  # fails on a *skipped* dependency by design, so a conditional job would redden
  # the required check on every push to main. The script reads
  # `GITHUB_EVENT_NAME` and exits 0 with a line saying so, and the job still
  # reports.
  #
  # Its own job rather than a step in the matrix, for the reason `audit` and
  # `style` already state: the answer does not depend on which Node version is
  # running, and running it twice would report the same fault twice.
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `persist-credentials: false` because nothing in this job speaks to git,
      # on the `style` job's stated reasoning.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: pnpm exec tsx scripts/check-pr.ts

  # The required status check. Named `gates` and nothing else.
  gates:
    name: gates
    needs: [suite, audit, style, conventions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every dependency to have passed
        # Each `result` is 'success' only when that job — and, for a matrix,
        # every one of its legs — succeeded. Skipped and cancelled must fail
        # the gate rather than pass it by omission, which is why this compares
        # against 'success' explicitly instead of checking for 'failure'.
        run: |
          echo "suite: ${{ needs.suite.result }}"
          echo "audit: ${{ needs.audit.result }}"
          echo "style: ${{ needs.style.result }}"
          echo "conventions: ${{ needs.conventions.result }}"
          test "${{ needs.suite.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.style.result }}" = "success"
          test "${{ needs.conventions.result }}" = "success"
